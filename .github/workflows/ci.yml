name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scaffold:
    name: "[scaffold]"
    runs-on: ubuntu-latest

    steps:
      - name: checkout
        uses: actions/checkout@v5

      - name: checks not enabled yet
        run: |
          echo "CI scaffold is in place."
          echo "Add install, lint, test, typecheck, and build jobs when this project is ready for enforced checks."
